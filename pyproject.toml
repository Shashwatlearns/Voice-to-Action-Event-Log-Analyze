[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-to-action"
version = "0.1.0"
description = "Voice-to-Action Event Log Analyzer: NER-powered parsing of spoken or typed event updates into actionable tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shashwat" }]
keywords = ["nlp", "spacy", "ner", "speech-recognition", "event-management", "streamlit"]
dependencies = [
    "spacy>=3.7,<4.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39", "pandas>=2.0"]
voice = ["SpeechRecognition>=3.10", "pydub>=0.25"]
whisper = ["faster-whisper>=1.0"]
mic = ["PyAudio>=0.2.13"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
vta = "voice_to_action.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["voice_to_action"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
